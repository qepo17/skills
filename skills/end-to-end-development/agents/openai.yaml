interface:
  display_name: "End-to-End Development"
  short_description: "Orchestrate workers and verify through an open PR"
  default_prompt: "Use $end-to-end-development to orchestrate bounded workers, implement, verify and review this repository change, then commit, push, create or update its PR, and return the URL with actual check/review status; honor explicit local-only or publication opt-outs and required approvals."
policy:
  allow_implicit_invocation: false
